# DigitalOcean Functions project for nulle.ai.
# Deployed by App Platform as the "api" component (see .do/app.yaml), served at /api.
# The contact form posts to /api/contact/submit.
#
# The environment values below are filled in at build time from the component's
# environment variables in App Platform, or from functions/.env when deploying
# with doctl. The deployer substitutes dollar-brace and dollar-paren patterns
# anywhere in this file, comments included, and fails the build on any name it
# can't resolve or that is empty. Keep those patterns out of comments.
packages:
  - name: contact
    environment:
      RESEND_API_KEY: "${RESEND_API_KEY}"
      CONTACT_TO: "${CONTACT_TO}"
      CONTACT_FROM: "${CONTACT_FROM}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
    functions:
      - name: submit
        runtime: nodejs:default
        web: true
        limits:
          timeout: 10000
          memory: 128
